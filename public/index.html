<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Evidence Chain | Blockchain Forensics</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Share Tech Mono', monospace;
    max-width: 950px;
    margin: 0 auto;
    background: #02040a;
    color: #7fdfff;
    padding: 0 15px 40px;
    position: relative;
    overflow-x: hidden;
  }

  /* --- Binary rain background --- */
  #binaryCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    opacity: 0.14;
  }

  /* --- Header with scanning eye --- */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 35px 0 20px;
    border-bottom: 1px solid #00eaff33;
  }
  .eye-icon {
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 2px solid #00eaff;
    box-shadow: 0 0 15px #00eaffaa, inset 0 0 10px #00eaff77;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    animation: pulseEye 2.5s ease-in-out infinite;
  }
  .eye-icon::before {
    content: "";
    width: 14px; height: 14px;
    background: #00eaff;
    border-radius: 50%;
    box-shadow: 0 0 10px #00eaff;
  }
  @keyframes pulseEye {
    0%, 100% { box-shadow: 0 0 15px #00eaffaa, inset 0 0 10px #00eaff77; }
    50% { box-shadow: 0 0 30px #ff00c8aa, inset 0 0 15px #ff00c877; border-color: #ff00c8; }
  }
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 24px;
    color: #00eaff;
    text-shadow: 0 0 10px #00eaff, 0 0 25px #00eaff55;
    letter-spacing: 3px;
    margin: 0;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    font-size: 11px;
    letter-spacing: 4px;
    color: #ff00c8;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* --- Network status bar --- */
  .status-bar {
    display: flex;
    justify-content: center;
    gap: 25px;
    font-size: 11px;
    padding: 12px 0;
    color: #7fdfff99;
    letter-spacing: 1px;
    flex-wrap: wrap;
  }
  .status-bar span::before {
    content: "●";
    color: #00ff9a;
    margin-right: 5px;
    text-shadow: 0 0 6px #00ff9a;
  }

  h2 {
    font-family: 'Orbitron', sans-serif;
    color: #00eaff;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-bottom: 1px solid #00eaff33;
    padding-bottom: 8px;
  }

  section {
    background: linear-gradient(180deg, #071322cc, #030a12cc);
    border: 1px solid #00eaff33;
    box-shadow: 0 0 20px #00eaff11, inset 0 0 25px #00eaff08;
    padding: 22px;
    border-radius: 6px;
    margin-bottom: 28px;
    position: relative;
    backdrop-filter: blur(2px);
  }
  section::before, section::after {
    content: "";
    position: absolute;
    width: 16px; height: 16px;
  }
  section::before { top: -1px; left: -1px; border-top: 2px solid #00eaff; border-left: 2px solid #00eaff; }
  section::after { bottom: -1px; right: -1px; border-bottom: 2px solid #ff00c8; border-right: 2px solid #ff00c8; }

  input, textarea, button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 11px;
    border-radius: 3px;
    border: 1px solid #00eaff44;
    background: #010509;
    color: #7fdfff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #00eaff;
    box-shadow: 0 0 10px #00eaff55;
  }
  button {
    background: linear-gradient(90deg, #00eaff22, #ff00c822);
    color: #00eaff;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid #00eaff88;
  }
  button:hover {
    background: linear-gradient(90deg, #00eaff, #ff00c8);
    color: #001018;
    box-shadow: 0 0 20px #00eaff88;
  }

  .result {
    margin-top: 12px;
    padding: 14px;
    border-radius: 3px;
    font-size: 12px;
    border: 1px solid;
    word-break: break-all;
  }
  .verified { background: #00ff9a11; border-color: #00ff9a; color: #00ff9a; text-shadow: 0 0 6px #00ff9a77; }
  .tampered { background: #ff003c11; border-color: #ff003c; color: #ff5577; text-shadow: 0 0 6px #ff003c77; }

  /* --- Blockchain hexagon log --- */
  #chainLog { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
  .block-node {
    position: relative;
    width: 90%;
    max-width: 600px;
    background: linear-gradient(135deg, #061826, #030d18);
    border: 1px solid #00eaff66;
    clip-path: polygon(4% 0, 96% 0, 100% 15%, 100% 85%, 96% 100%, 4% 100%, 0 85%, 0 15%);
    padding: 16px 22px;
    margin-bottom: 4px;
    font-size: 11px;
    box-shadow: 0 0 15px #00eaff22;
  }
  .block-node .block-id {
    font-family: 'Orbitron', sans-serif;
    color: #ff00c8;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 6px;
    text-shadow: 0 0 8px #ff00c877;
  }
  .block-node div { margin: 3px 0; word-break: break-all; color: #7fdfffcc; }
  .block-node b { color: #00eaff; }
  .chain-link {
    width: 2px;
    height: 26px;
    background: linear-gradient(180deg, #00eaff, #ff00c8);
    box-shadow: 0 0 8px #00eaffaa;
    margin: -2px 0;
  }
  .empty-log { color: #7fdfff66; text-align: center; padding: 20px; font-size: 12px; letter-spacing: 1px; }
</style>
</head>
<body>

<canvas id="binaryCanvas"></canvas>

<div class="header">
  <div class="eye-icon"></div>
  <div>
    <h1>CYBER EVIDENCE CHAIN</h1>
    <div class="subtitle">Blockchain Forensics System</div>
  </div>
</div>

<div class="status-bar">
  <span>GANACHE NETWORK: CONNECTED</span>
  <span id="blockCountStatus">TOTAL BLOCKS: --</span>
</div>

<section>
  <h2>▸ Upload Evidence</h2>
  <form id="uploadForm">
    <input type="file" id="evidenceFile" required>
    <textarea id="description" placeholder="Description (e.g. Case #123 - suspect laptop image)"></textarea>
    <button type="submit">Upload &amp; Register on Blockchain</button>
  </form>
  <div id="uploadResult"></div>
</section>

<section>
  <h2>▸ Verify Evidence Integrity</h2>
  <form id="verifyForm">
    <input type="file" id="verifyFile" required>
    <button type="submit">Scan &amp; Verify Against Blockchain</button>
  </form>
  <div id="verifyResult"></div>
</section>

<section>
  <h2>▸ Evidence Chain of Custody</h2>
  <button onclick="loadEvidence()">↻ Refresh Chain</button>
  <div id="chainLog"><div class="empty-log">No blocks loaded yet...</div></div>
</section>

<script>
  // Binary rain background
  const canvas = document.getElementById("binaryCanvas");
  const ctx = canvas.getContext("2d");
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener("resize", resize);
  const fontSize = 16;
  let columns = Math.floor(canvas.width / fontSize);
  let drops = Array(columns).fill(1);
  function drawRain() {
    ctx.fillStyle = "rgba(2,4,10,0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00eaff";
    ctx.font = fontSize + "px monospace";
    drops.forEach((y, i) => {
      const text = Math.random() > 0.5 ? "1" : "0";
      ctx.fillText(text, i * fontSize, y * fontSize);
      if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    });
  }
  setInterval(drawRain, 60);

  const uploadForm = document.getElementById("uploadForm");
  const verifyForm = document.getElementById("verifyForm");

  uploadForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const file = document.getElementById("evidenceFile").files[0];
    const description = document.getElementById("description").value;
    const formData = new FormData();
    formData.append("evidenceFile", file);
    formData.append("description", description);

    document.getElementById("uploadResult").innerHTML = "⏳ Writing to blockchain...";

    try {
      const res = await fetch("/upload", { method: "POST", body: formData });
      const data = await res.json();
      if (data.success) {
        document.getElementById("uploadResult").innerHTML =
          `<div class="result verified">✅ REGISTERED ON CHAIN<br>Hash: ${data.fileHash}<br>Tx: ${data.txHash}</div>`;
        loadEvidence();
      } else {
        document.getElementById("uploadResult").innerHTML = `<div class="result tampered">❌ ${data.error}</div>`;
      }
    } catch (err) {
      document.getElementById("uploadResult").innerHTML = `<div class="result tampered">❌ ${err.message}</div>`;
    }
  });

  verifyForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const file = document.getElementById("verifyFile").files[0];
    const formData = new FormData();
    formData.append("verifyFile", file);

    document.getElementById("verifyResult").innerHTML = "🔍 Scanning against blockchain...";

    try {
      const res = await fetch("/verify", { method: "POST", body: formData });
      const data = await res.json();
      if (data.verified) {
        document.getElementById("verifyResult").innerHTML =
          `<div class="result verified">✅ VERIFIED — MATCH FOUND ON CHAIN<br>Hash: ${data.fileHash}</div>`;
      } else {
        document.getElementById("verifyResult").innerHTML =
          `<div class="result tampered">⚠️ NO MATCH — FILE TAMPERED OR UNREGISTERED<br>Hash: ${data.fileHash}</div>`;
      }
    } catch (err) {
      document.getElementById("verifyResult").innerHTML = `<div class="result tampered">❌ ${err.message}</div>`;
    }
  });

  async function loadEvidence() {
    const res = await fetch("/evidence");
    const records = await res.json();
    const log = document.getElementById("chainLog");
    document.getElementById("blockCountStatus").textContent = "TOTAL BLOCKS: " + records.length;

    if (records.length === 0) {
      log.innerHTML = '<div class="empty-log">No blocks loaded yet...</div>';
      return;
    }

    log.innerHTML = "";
    records.forEach((r, idx) => {
      const date = new Date(r.timestamp * 1000).toLocaleString();
      log.innerHTML += `
        <div class="block-node">
          <div class="block-id">⬡ BLOCK #${r.id}</div>
          <div><b>File:</b> ${r.fileName}</div>
          <div><b>Hash:</b> ${r.fileHash}</div>
          <div><b>Description:</b> ${r.description || "—"}</div>
          <div><b>Uploaded By:</b> ${r.uploadedBy}</div>
          <div><b>Timestamp:</b> ${date}</div>
        </div>`;
      if (idx < records.length - 1) {
        log.innerHTML += `<div class="chain-link"></div>`;
      }
    });
  }

  loadEvidence();
</script>

</body>
</html>
